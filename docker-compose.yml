# Runs the whole app locally: database + backend API + frontend.
# Usage:
#   cp .env.example .env
#   docker compose up --build
# Then open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed on localhost:5432 so you can inspect the DB with a tool if you want.
    ports:
      - "5432:5432"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: ${NODE_ENV}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
    ports:
      - "${PORT}:${PORT}"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Where nginx forwards /api requests (backend service name + port).
      API_UPSTREAM: server:${PORT}
    ports:
      - "${WEB_PORT}:80"

volumes:
  postgres-data:
