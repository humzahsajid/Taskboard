name: Build & Deploy

# On every push to main: build both container images, push them to the GitHub
# Container Registry, then SSH to the Droplet and roll the running stack forward
# to the new images. Also runnable manually from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/taskboard-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to Droplet
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e && cd /opt/taskboard && git fetch --depth 1 origin main && git reset --hard origin/main && IMAGE_TAG='sha-${{ github.sha }}' GH_ACTOR='${{ github.actor }}' GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' bash deploy/remote-update.sh"

      - name: Verify health on the Droplet
        # The app is only reachable via the Cloudflare Tunnel now, so we check
        # /api/health on the Droplet's loopback rather than over the public IP.
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'for i in $(seq 1 24); do
               code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || true)
               [ "$code" = "200" ] && { echo "healthy"; curl -s http://localhost/api/health; echo; exit 0; }
               echo "attempt $i: HTTP $code"; sleep 5
             done
             echo "health check never returned 200"; exit 1'
